services:

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: health-next-backend
    ports:
      - "4000:4000"
    env_file:
      - ./Backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:4000
    container_name: health-next-frontend
    ports:
      - "5173:80"
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:4000
    container_name: health-next-admin
    ports:
      - "5174:80"
    restart: unless-stopped